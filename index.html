<style>
  :root {
    --cream: #F5F0E8;
    --cream-dark: #EDE6D6;
    --ink: #1A1714;
    --ink-soft: #3D3830;
    --ink-muted: #7A7268;
    --sand: #C4B8A0;
    --terra: #7D2E3E;
    --terra-light: #A85570;
    --white: #FDFCF9;
    --serif: 'Playfair Display', Georgia, serif;
    --sans: 'DM Sans', system-ui, sans-serif;
    --max: 1100px;
    --col: 660px;
  }

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  html { scroll-behavior: smooth; }

  body {
    background: var(--cream);
    color: var(--ink);
    font-family: var(--sans);
    font-size: 16px;
    line-height: 1.7;
    -webkit-font-smoothing: antialiased;
  }

  /* ── TIPOGRAFIA ─────────────────────────────── */
  h1, h2, h3 { font-family: var(--serif); font-weight: 500; line-height: 1.2; }

  .display {
    font-family: var(--serif);
    font-size: clamp(2.4rem, 5vw, 4rem);
    font-weight: 400;
    line-height: 1.1;
    letter-spacing: -0.02em;
  }

  .display em { font-style: italic; color: var(--terra); }

  .label {
    font-family: var(--sans);
    font-size: 0.68rem;
    font-weight: 500;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--ink-muted);
  }

  p { color: var(--ink-soft); }

  /* ── LAYOUT ─────────────────────────────────── */
  .container { max-width: var(--max); margin: 0 auto; padding: 0 2rem; }
  .col-text { max-width: var(--col); }

  section { padding: 7rem 0; }
  section:first-of-type { padding-top: 0; }

  hr.divider {
    border: none;
    border-top: 1px solid var(--sand);
    margin: 0;
    opacity: 0.5;
  }

  /* ── BOTÕES ─────────────────────────────────── */
  .btn {
    display: inline-block;
    font-family: var(--sans);
    font-size: 0.85rem;
    font-weight: 500;
    letter-spacing: 0.06em;
    text-decoration: none;
    padding: 1rem 2.2rem;
    border-radius: 2px;
    transition: all 0.25s ease;
    cursor: pointer;
  }

  .btn-primary {
    background: var(--ink);
    color: var(--cream);
    border: 1.5px solid var(--ink);
  }

  .btn-primary:hover {
    background: var(--terra);
    border-color: var(--terra);
    transform: translateY(-1px);
  }

  .btn-outline {
    background: transparent;
    color: var(--ink);
    border: 1.5px solid var(--ink);
  }

  .btn-outline:hover {
    background: var(--ink);
    color: var(--cream);
    transform: translateY(-1px);
  }

  .btn-large {
    font-size: 0.92rem;
    padding: 1.2rem 3rem;
    letter-spacing: 0.08em;
  }

  /* ── HERO ────────────────────────────────────── */
  #hero {
    min-height: 100vh;
    display: grid;
    grid-template-columns: 1fr 1fr;
    align-items: end;
    gap: 0;
    background: var(--cream);
    position: relative;
    overflow: hidden;
    padding: 0;
  }

  #hero::before {
    content: '';
    position: absolute;
    top: 0; right: 0;
    width: 55%;
    height: 100%;
    background: var(--cream-dark);
    z-index: 0;
  }

  .hero-content {
    position: relative;
    z-index: 1;
    padding: 8rem 3rem 6rem 2rem;
    max-width: 600px;
    margin-left: auto;
    padding-left: 3rem;
  }

  .hero-eyebrow {
    display: flex;
  </div>
</section>
